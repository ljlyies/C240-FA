
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posters | StudySpark</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <nav class="nav container">
        <a href="index.html" class="brand">StudySpark</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="choose-path.html">Subjects</a>
          <a href="tutor.html">AI Tutor</a>
          <a href="study-resources.html">Resources</a>
          <a href="posters.html" class="active-link">Posters</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="page-main container">
      <section class="page-card">
        <h1>Site Posters</h1>
        <p class="resources-copy">This is our highlighted design, showcasing the theme of StudySpark.</p>
        <div id="poster-gallery" class="poster-grid" style="margin-top:1rem;"></div>
      </section>
    </main>

    <script>
      const posters = [
        {
          src: 'assets/Study-Spark-Poster.jpeg',
          alt: 'Original StudySpark poster',
          title: 'Study Spark Poster'
        },
        {
          src: 'assets/Study-Spark-Poster2.jpeg',
          alt: 'Updated StudySpark poster',
          title: 'Study Spark Poster 2'
        }
      ];

      function renderPosters(container, items) {
        if (!container) return;

        container.innerHTML = items
          .map(
            (poster) => `
              <div class="card poster-card-static">
                <img src="${poster.src}" alt="${poster.alt}" class="poster-image-static" />
                <div class="poster-card-caption"><strong>${poster.title}</strong></div>
              </div>
            `
          )
          .join('');
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderPosters(document.getElementById('poster-gallery'), posters);
        renderPosters(document.getElementById('featured-posters'), posters);
      });
    </script>
  </body>
</html>
